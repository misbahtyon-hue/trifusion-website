  <!-- Custom Styles untuk Desain Baru Product Detail -->
  <style>
    body { background-color: #f4f8fc; }
    
    /* Layout Detail Utama */
    .detail-wrapper { padding: 120px 0 80px; }
    
    .detail-breadcrumb {
      margin-bottom: 30px; display: inline-flex; align-items: center; gap: 12px;
      font-size: 0.85rem; font-weight: 600; color: var(--color-primary);
      text-decoration: none; background: white; padding: 8px 16px;
      border-radius: 30px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); transition: all 0.3s ease;
    }
    .detail-breadcrumb:hover { background: var(--color-primary); color: white; transform: translateX(-5px); }
    .detail-breadcrumb svg { width: 16px; height: 16px; }

    /* Grid Layout: Kiri (Gambar) & Kanan (Info) */
    .detail-hero { display: grid; grid-template-columns: 1fr; gap: 40px; margin-bottom: 60px; }
    @media (min-width: 992px) { .detail-hero { grid-template-columns: 1fr 1.1fr; align-items: flex-start; } }

    /* Bagian Gambar (Kiri) */
    .detail-gallery {
      background: white; border-radius: 20px; padding: 40px; border: 1px solid var(--color-border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.03); position: sticky; top: 100px;
      display: flex; justify-content: center; align-items: center; min-height: 400px;
    }
    .detail-gallery img { width: 100%; max-width: 450px; height: auto; object-fit: contain; transition: transform 0.5s ease; }
    .detail-gallery:hover img { transform: scale(1.05); }

    /* Bagian Info (Kanan) */
    .detail-info { display: flex; flex-direction: column; }
    .detail-tags { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
    .tag-category { background: #eaf3fa; color: var(--color-primary); padding: 6px 14px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
    .tag-brand { background: var(--color-bg-muted); color: var(--color-text); padding: 6px 14px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; border: 1px solid var(--color-border); }
    .tag-akl { background: var(--color-accent-600); color: #fff; padding: 6px 14px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; border: 1px solid var(--color-accent-600); display: flex; align-items: center; gap: 6px; }
    .tag-akl.process { background: #fff4d6; color: #7a5a00; border-color: #f0d78a; }
    .tag-akl svg { width: 14px; height: 14px; }

    .detail-title { font-size: clamp(2rem, 4vw, 3rem); color: var(--color-primary); line-height: 1.1; margin-bottom: 24px; font-family: var(--font-display); letter-spacing: -0.03em; }
    .detail-desc { font-size: 1.05rem; color: var(--color-text); line-height: 1.7; margin-bottom: 40px; }

    /* Blok Spesifikasi (Tabel Modern) */
    .specs-card { background: white; border-radius: 16px; border: 1px solid var(--color-border); overflow: hidden; margin-bottom: 40px; }
    .specs-header { background: #f9fbfd; padding: 16px 24px; border-bottom: 1px solid var(--color-border); font-weight: 700; color: var(--color-ink); font-size: 1.1rem; display: flex; align-items: center; gap: 10px; }
    .specs-header svg { width: 20px; height: 20px; flex-shrink: 0; }
    .spec-row { display: grid; grid-template-columns: 140px 1fr; padding: 16px 24px; border-bottom: 1px solid var(--color-bg-muted); }
    .spec-row:last-child { border-bottom: none; }
    .spec-key { font-size: 0.9rem; color: var(--color-text-light); font-weight: 500; }
    .spec-val { font-size: 0.95rem; color: var(--color-ink); font-weight: 600; }

    /* Fitur Unggulan (Grid) */
    .features-section h3 { font-size: 1.25rem; color: var(--color-primary); margin-bottom: 20px; }
    .features-grid { display: grid; grid-template-columns: 1fr; gap: 16px; margin-bottom: 40px; }
    @media (min-width: 600px) { .features-grid { grid-template-columns: 1fr 1fr; } }
    .feature-item { display: flex; align-items: flex-start; gap: 12px; background: white; padding: 16px; border-radius: 12px; border: 1px solid var(--color-border); }
    .feature-item svg { width: 20px; height: 20px; color: var(--color-primary); flex-shrink: 0; margin-top: 2px; }
    .feature-item span { font-size: 0.9rem; color: var(--color-text); line-height: 1.5; }

    /* CTA Box */
    .detail-cta-box { background: var(--color-primary); border-radius: 16px; padding: 30px; color: white; display: flex; flex-direction: column; gap: 20px; box-shadow: 0 10px 25px rgba(46, 108, 166, 0.22); }
    @media (min-width: 768px) { .detail-cta-box { flex-direction: row; align-items: center; justify-content: space-between; } }
    .detail-cta-box h4 { font-size: 1.2rem; margin-bottom: 6px; color: white; }
    .detail-cta-box p { margin: 0; font-size: 0.9rem; opacity: 0.9; }
